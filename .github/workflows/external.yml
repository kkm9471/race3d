# 다른 네트워크에서 접속 시험 — GitHub 클라우드 PC 에서 공개 주소로 방에 들어가 레이스를 탄다
name: 외부 접속 시험

on:
  workflow_dispatch:
    inputs:
      room:
        description: 방 코드
        required: true
      car:
        description: 차
        default: heukmeonji

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save puppeteer-core@23
      - name: 원격 참가
        env:
          ROOM: ${{ inputs.room }}
          CAR: ${{ inputs.car }}
        run: node tests/remote_player.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-result
          path: |
            remote_result.json
            remote_shot.png
