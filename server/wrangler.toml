name = "race3d-rooms"
main = "src/room.js"
compatibility_date = "2025-04-10"

# 무료 플랜은 SQLite 방식 Durable Object 만 된다 (new_classes 로 적으면 배포 거부)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[observability]
enabled = true
# 로그는 100번 중 1번만 남긴다 (기본 1 = 전부). 폭주 때 로그 요금이 요청 요금보다 커지지 않게 — 2026-10-31
head_sampling_rate = 0.01
